<div class="chat-container">

  <!-- Header -->
  <div class="chat-header">
    <button class="back-btn" (click)="back()">
      <span class="material-icons">arrow_back</span>
    </button>
    <img [src]="userData.avatar || 'assets/images/winter-soldier.jpg'" class="header-avatar">
    <div class="header-info">
      <span class="header-name">{{ userData.name || aiName }}</span>
      <span class="header-status">Online</span>
    </div>
  </div>

  <!-- Messages area -->
  <div id="chat-messages" #chatMessages (scroll)="onScroll()" (click)="handleMessageClick($event)">
    <div class="message" *ngFor="let message of messages; let i = index"
         [ngClass]="{'own': message.isOwn, 'welcome': message.isWelcome}">
      <img [src]="message.avatar" class="msg-avatar">
      <div class="bubble" [ngClass]="{'own-bubble': message.isOwn, 'ai-bubble': !message.isOwn}">
        <div class="markdown-content" [innerHTML]="message.htmlText"></div>
        <span class="msg-time" *ngIf="message.time">{{message.time}}</span>
      </div>
    </div>

    <!-- Loading indicator -->
    <div class="message" *ngIf="isLoading">
      <img [src]="userData.avatar || 'assets/images/winter-soldier.jpg'" class="msg-avatar">
      <div class="bubble ai-bubble typing-bubble">
        <div class="typing-indicator">
          <span></span>
          <span></span>
          <span></span>
        </div>
      </div>
    </div>
  </div>

  <!-- Scroll to bottom button -->
  <button class="scroll-btn" *ngIf="showScrollBtn" (click)="scrollToBottom()">
    <span class="material-icons">keyboard_arrow_down</span>
  </button>

  <!-- Input area -->
  <div class="input-area">
    <input type="text"
           #messageInput
           placeholder="Type a message..."
           (keyup.enter)="send()"
           [disabled]="isLoading">
    <button class="send-btn" (click)="send()" [disabled]="isLoading">
      <span class="material-icons">send</span>
    </button>
  </div>

</div>
